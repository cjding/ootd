<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f1eb">
  <meta name="description" content="Daily Edit — your private, weather-aware wardrobe assistant">
  <title>Daily Edit</title>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div id="app"><main class="startup">Opening Daily Edit…</main></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module">
    import('./src/app.js').catch((error) => {
      document.querySelector('#app').innerHTML = `
        <main class="startup">
          <h1>Daily Edit could not open.</h1>
          <p>Refresh the page. If this continues, share the message below:</p>
          <code>${String(error.message || error).replace(/[&<>]/g, '')}</code>
        </main>`;
    });
  </script>
</body>
</html>
